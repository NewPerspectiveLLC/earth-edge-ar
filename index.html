// ---- local layer: finite grid + target lines (approximate on iOS: GPS+compass, smoothed) ----
const TARGETS=[['Ready Athletics (997800502)',48.11035,-122.80591,0xffc800],['Cappy\'s Trails garden (998002802)',48.13165,-122.79921,0x30ff60],['Memory\'s Vault, Fort Worden',48.1384642,-122.7647029,0xc060ff],['Port Townsend City Hall',48.1161771,-122.753612,0x40e0ff],['Jefferson County Sheriff\'s Office',48.0241638,-122.764488,0xff7020],['Jefferson Healthcare Hospital',48.1060007,-122.7889962,0xff4060]];
const local=new T.Group();scene.add(local);let L0=null,sm=null;
function mPer(la){return[111320,111320*Math.cos(la*D)]}
function buildLocal(la,lo){L0=[Math.round(la*1000)/1000,Math.round(lo*1000)/1000];// grid origin snapped to rounded lat/lon (~100 m)
local.clear();const H=-1.6;// eye height below camera, not GPS altitude
// procedural grid shader on one 20 km plane: world-anchored ENU coords, AA constant-pixel lines, 20 m / 100 m / 1 km cascade
const gmat=new T.ShaderMaterial({transparent:true,depthTest:false,depthWrite:false,blending:T.AdditiveBlending,extensions:{derivatives:true},

 fragmentShader:`varying vec2 vP;varying float vD;
 float ln(float s,float px){vec2 c=vP/s;vec2 w=fwidth(c);vec2 g=abs(fract(c-.5)-.5)/w;float l=1.-min(min(g.x,g.y)/px,1.);float dens=max(w.x,w.y);return l*(1.-smoothstep(.15,.5,dens));}
 void main(){float a=ln(20.,1.5)*.55+ln(100.,3.)*.8+ln(1000.,3.)*.9;float fade=1.-smoothstep(3000.,10000.,vD);float glow=smoothstep(4000.,10000.,vD)*.12;

const gm=new T.Mesh(new T.PlaneGeometry(20000,20000,4,4).rotateX(-Math.PI/2).translate(0,H,0),gmat);gm.renderOrder=6;gm.frustumCulled=false;local.add(gm);
const[my,mx]=mPer(L0[0]);
for(const[n,a,l,c]of TARGETS){const p=new T.Vector3((l-L0[1])*mx,H,-(a-L0[0])*my);
const pil=new T.Mesh(new T.CylinderGeometry(1.5,1.5,120,8),new T.MeshBasicMaterial({color:c,transparent:true,opacity:.75,blending:T.AdditiveBlending,depthTest:false,depthWrite:false}));pil.position.copy(p).y+=60;pil.renderOrder=7;local.add(pil);
const ln=new T.Line(new T.BufferGeometry().setFromPoints([new T.Vector3(),p]),new T.LineBasicMaterial({color:c,depthTest:false}));ln.renderOrder=7;ln.userData.t=p;local.add(ln);
const lb=label(n+'\n',  '#'+c.toString(16).padStart(6,'0'),{title:n,color:'#'+c.toString(16).padStart(6,'0')});lb.scale.set(160,40,1);lb.position.copy(p).y+=135;Object.assign(lb.userData,{lb:[n,c],t:p});local.add(lb);
fetch('sheridan.json').then(r=>r.json()).then(J=>{if(Math.hypot((L0[0]-48.117)*111,(L0[1]+122.78)*74)>15)return;// only within ~15 km of Port Townsend
 const[my,mx]=mPer(L0[0]),P=[];for(const[a,l]of J.points)P.push((l-L0[1])*mx,-1.55,-(a-L0[0])*my);
 const mk=(w,op,col)=>{const g=new LineGeometry();g.setPositions(P);const m=new LineMaterial({color:col,linewidth:w,transparent:true,opacity:op,depthTest:false,depthWrite:false,blending:T.AdditiveBlending,resolution:new T.Vector2(innerWidth,innerHeight)});const l=new Line2(g,m);l.computeLineDistances();l.renderOrder=8;l.frustumCulled=false;local.add(l);window.FATLINES=(window.FATLINES||[]).concat(m)};
 mk(16,.25,0xff00cc);mk(6,.9,0xff00cc);mk(2,1,0xffc0f0);// glow, ribbon, core
 for(let i=0,acc=0;i<J.points.length;i++){if(i%12===0){const lb=label('Sheridan St','#ff40e0',{title:'Sheridan Street',color:'#ff40e0'});lb.position.set(P[i*3],1,P[i*3+2]);local.add(lb)}}});
}}
function updLocal(la,lo,acc){if(!L0)buildLocal(la,lo);const[my,mx]=mPer(L0[0]);const tgt=new T.Vector3((lo-L0[1])*mx,0,-(la-L0[0])*my);

for(const o of local.children){if(o.isLine&&o.userData.t){const a=o.geometry.attributes.position;a.setXYZ(0,sm.x,-1.6,sm.z);a.needsUpdate=true}

let built=null;let MYPOS=null;import('./mp.js').then(M=>{window._mp=M.initMP({scene,cam,getPos:()=>MYPOS,toLocal:(a,l)=>{const[my,mx]=mPer(L0?L0[0]:a);const o=L0||[a,l];return new T.Vector3((l-o[1])*mx,-1.6,-(a-o[0])*my).add(local.position)}})});
async function build(la,lo){if(built&&Math.abs(built[0]-la)<.01&&Math.abs(built[1]-lo)<.01)return;built=[la,lo];
world.clear();markers=[];for(let i=LABELS.length-1;i>=0;i--)if(!LABELS[i].parent)LABELS.splice(i,1);
// translucent wireframe Earth, center at -R up
const earth=new T.Mesh(new T.SphereGeometry(R*SC,48,32),new T.MeshBasicMaterial({color:0x33aaff,wireframe:true,transparent:true,opacity:.18,depthTest:false}));
// orient globe: build from ECEF axes

const cols={N:'#ff4040',E:'#40ff60',S:'#40a0ff',W:'#ffd040'};const info=[];
for(const[k,b]of[['N',0],['E',90],['S',180],['W',270]]){const[a,l]=dest(la,lo,b);const p=toENU(ecef(a,l),la,lo).multiplyScalar(SC);
const dist=p.length(),el=Math.asin(p.y/dist)/D;const dot=new T.Mesh(new T.SphereGeometry(150,16,12),new T.MeshBasicMaterial({color:cols[k],depthTest:false}));dot.position.copy(p);dot.renderOrder=9;world.add(dot);
const ln=new T.Line(new T.BufferGeometry().setFromPoints([new T.Vector3(0,-2,0),p]),new T.LineBasicMaterial({color:cols[k],depthTest:false}));ln.renderOrder=8;world.add(ln);
const lb=label(`${k}  ${a.toFixed(3)}, ${l.toFixed(3)}\n${dist.toFixed(0)} km  el ${el.toFixed(1)}°`,cols[k],{title:`${k} edge of Earth (${a.toFixed(3)}, ${l.toFixed(3)})`,color:cols[k],distM:dist*1000,el});lb.scale.set(2400,600,1);lb.position.copy(p).add(new T.Vector3(0,500,0));world.add(lb);
console.log(k,dist.toFixed(0),el.toFixed(1),p.x.toFixed(0),p.y.toFixed(0),p.z.toFixed(0));info.push(`${k}: ${a.toFixed(3)},${l.toFixed(3)}`);
place(a,l).then(n=>{lb.userData.meta.title+=' · '+n;const l2=label(n,cols[k],lb.userData.meta);l2.scale.set(2400,600,1);l2.position.copy(p).add(new T.Vector3(0,-500,0));world.add(l2)})}

// orientation
let ori=null,headOff=0;const zee=new T.Vector3(0,0,1),q1=new T.Quaternion(-Math.sqrt(.5),0,0,Math.sqrt(.5)),eu=new T.Euler();
function onOri(e){ori=e;if(e.webkitCompassHeading!=null){/* align alpha to true north */const h=(360-e.webkitCompassHeading)-e.alpha;let dd=((h-headOff+540)%360)-180;if(Math.abs(dd)>2)headOff+=dd*.05}}
function setCam(){if(q.has('look')){const k=q.get('look'),v={P:[0.2,-0.3,-1],H:[-0.25,-0.05,1],G:[-1,-0.03,-0.35],N:[0,-1,-1],E:[1,-1,0],S:[0,-1,1],W:[-1,-1,0]}[k];cam.lookAt(...v);return}if(!ori)return;const a=((ori.alpha||0)+headOff)*D,b=(ori.beta||0)*D,g=(ori.gamma||0)*D,so=(screen.orientation?.angle||window.orientation||0)*D;

async function start(){document.getElementById('start').remove();

// constant-size labels + simple overlap push + tap card + zoom
const PXH=36,pv=new T.Vector3();
function layoutLabels(){const h=innerHeight,placed=[];for(const s of LABELS){if(!s.parent){continue}const sh=PXH*2.6/h*2*Math.tan(cam.fov*D/2)/2;s.scale.set(sh*8,sh,1);s.center.x=(s.userData.tw||512)/2048;

 const t=(v>0?'+':'')+v.toFixed(1)+' m';hpV.textContent=t;hpR.textContent=t;hpS.value=v;hpK.style.top=((HMAX-v)/(HMAX-HMIN)*172)+'px';if(buzz&&navigator.vibrate)navigator.vibrate(8)}

let drag=null;addEventListener('pointerdown',e=>{if(desk&&!e.target.closest('button,select,#mpc,#hpP,#hpD,#card,#zoom'))drag=[e.clientX,e.clientY,yaw,pitch,0]});
addEventListener('pointermove',e=>{if(drag){const dx=e.clientX-drag[0],dy=e.clientY-drag[1];drag[4]=Math.max(drag[4],Math.abs(dx)+Math.abs(dy));yaw=(drag[2]-dx*.2+3600)%360;pitch=Math.max(-89,Math.min(89,drag[3]+dy*.2))}});
addEventListener('pointerup',()=>{drag=null});
addEventListener('keydown',e=>{if(!desk)return;if(e.key==='ArrowLeft')yaw=(yaw-3+360)%360;if(e.key==='ArrowRight')yaw=(yaw+3)%360;if(e.key==='ArrowUp')pitch=Math.min(89,pitch+3);if(e.key==='ArrowDown')pitch=Math.max(-89,pitch-3)});
function deskCam(){if(!desk||ori||q.has('look'))return;cam.rotation.set(pitch*D,-yaw*D,0,'YXZ');hdg.textContent=Math.round(yaw)+'°'}
setTimeout(()=>{if(!ori)enterDesk()},2500);
ren.setAnimationLoop(t=>{setCam();deskCam();window._mp&&window._mp.frame(t);layoutLabels();updArrow();ren.render(scene,cam)});
</script></body></html>
